version: "3.9"

services:
  # ─── Development / SQLite mode ──────────────────────────────
  bot:
    build: .
    container_name: cement_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot_data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/cement_stock.db
    profiles: ["dev", "default"]

  # ─── Production: PostgreSQL ──────────────────────────────────
  bot_prod:
    build: .
    container_name: cement_bot_prod
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://cement:${POSTGRES_PASSWORD}@db:5432/cement_stock
    profiles: ["prod"]

  db:
    image: postgres:16-alpine
    container_name: cement_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cement_stock
      POSTGRES_USER: cement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cement -d cement_stock"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["prod"]

volumes:
  bot_data:
  pg_data:
