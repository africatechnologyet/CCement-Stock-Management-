name: Development checks

on:
  push:
    branches:
      - cobuilt-integration-dev
  pull_request:
    branches:
      - cobuilt-integration-dev

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile both bots and supervisor
        run: |
          python -m py_compile bot.py supervisor.py concrete_app/concrete_logistics_bot.py migrations/production/import_concrete_data.py
      - name: Check dependency consistency
        run: python -m pip check
