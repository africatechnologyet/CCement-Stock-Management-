services:
  - type: worker
    name: cobuilt-integrated-worker-dev
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python supervisor.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CEMENT_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: STOREKEEPER_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      - key: DEFAULT_LOW_STOCK_KG
        value: "20000"
      - key: TIMEZONE
        value: Africa/Addis_Ababa
